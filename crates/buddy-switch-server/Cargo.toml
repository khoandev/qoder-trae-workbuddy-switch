[package]
name = "buddy-switch-server"
version = "2026.11.161923"
edition = "2021"
description = "buddy-switch HTTP server + CLI（npm 安装形态：buddy-switch 命令启动本地 webui）"

[[bin]]
name = "buddy-switch"
path = "src/main.rs"

[dependencies]
buddy-switch-core = { path = "../buddy-switch-core" }
buddy-switch-gateway = { path = "../buddy-switch-gateway" }
# SQLCipher 通道（与桌面端同一份实现；feature 并集，见 src-tauri/Cargo.toml 的说明）。
buddy-switch-vault = { path = "../buddy-switch-vault" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
rust-embed = "8"
# 管理面登录的会话 Token（`app_auth::new_session`，32 位小写十六进制）。
# 已由 core / gateway 引入（同版本同 feature），不新增任何 package。
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# `tower` 已在 Cargo.lock（axum 0.7 的传递依赖），仅用于路由级测试的 `oneshot` 驱动。
tower = { version = "0.5", features = ["util"] }
# `rusqlite` 已在依赖树中（buddy-switch-core 以同版本同 feature 使用），零网络。
# 仅用于路由级测试构造 `workbuddy.db` 夹具。
rusqlite = { version = "0.32", features = ["bundled"] }
